[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to the persistent Node backend on Render.
# Keep this rule BEFORE the SPA fallback so /api/* never returns index.html.
[[redirects]]
  from = "/api/*"
  to = "https://agentpay-api.onrender.com/api/:splat"
  status = 200
  force = true

# React/Vite single-page application routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
